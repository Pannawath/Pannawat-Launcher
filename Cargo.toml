[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/auth",
    "crates/downloader",
    "crates/mod-manager",
    "crates/jvm-builder",
    "crates/game-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Pannawath"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
anyhow = "1"
thiserror = "1"
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v3", "v4", "md5"] }
md-5 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"
